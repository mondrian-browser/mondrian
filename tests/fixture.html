<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture</title>
<style>
 body { font: 16px system-ui; margin: 0; padding: 24px; }
 .spacer { height: 1400px; background: linear-gradient(#fff, #eee); }
 .noisy { background: #fdd; padding: 8px; }
 button, input, select { font: inherit; padding: 6px 10px; margin: 4px 0; display: block; }
 #out { font-family: monospace; padding: 6px; background: #f3f3f3; }
</style></head>
<body>
  <article id="decoy-landmark">Sponsored</article>
  <h1>Fixture page</h1>
  <p>Some readable prose that page_text should return in full, with a distinctive marker: PINEAPPLE_MARKER.</p>

  <div class="noisy">This block is the one the CSS rule should hide.</div>

  <button id="hello">Say hello</button>
  <input id="name" placeholder="Your name">
  <select id="pick"><option value="a">Alpha</option><option value="b">Beta</option><option value="c">Gamma</option></select>
  <a href="#anchored" id="link">A link that goes nowhere</a>
  <div id="out">nothing yet</div>

  <div class="sponsored-thing">Pretend advertisement, hidden by a cosmetic filter.</div>
  <script src="/adtest.js"></script>

  <div class="spacer"></div>
  <p id="bottom">Bottom of the page.</p>

  <script>
    document.getElementById('hello').addEventListener('click', () => {
      document.getElementById('out').textContent = 'clicked:' + (document.getElementById('name').value || 'anon');
      console.log('fixture button clicked');
    });
    document.getElementById('pick').addEventListener('change', (e) => {
      document.getElementById('out').textContent = 'picked:' + e.target.value;
    });
    console.log('fixture loaded');
    window.__framed = false;
    window.addEventListener('message', (e) => {
      if (e.data === 'denyframe-rendered') { window.__framed = true; return; }
      if (e.data === 'frame-me') {
        const f = document.createElement('iframe'); f.src = '/denyframe'; f.id = 'injected-frame'; document.body.appendChild(f);
      }
    });
  </script>
</body></html>
